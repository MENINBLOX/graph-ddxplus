# Graph store for the literature-derived diagnosis KG (research design D8, RQ3).
#   docker compose up -d neo4j
# Browser: http://localhost:7474  Bolt: bolt://localhost:7687  (auth from .env: NEO4J_AUTH=neo4j/<password>)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: thesis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/thesis-dev-only}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 4G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/import:/import
      - ./data/neo4j/logs:/logs
    restart: unless-stopped
