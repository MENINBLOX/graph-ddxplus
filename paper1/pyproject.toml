[project]
name = "ddxkb"
version = "0.0.0"
description = "How much of DDXPlus does its public knowledge base solve? (design: docs/design/ddxplus_kb_redo.md)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddxkb"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
