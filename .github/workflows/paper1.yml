name: paper1
on:
  push:
    paths: ["paper1/**", ".github/workflows/paper1.yml"]
  pull_request:
    paths: ["paper1/**", ".github/workflows/paper1.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
